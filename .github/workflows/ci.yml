name: CI
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Zero runtime/dev dependencies — no install step needed.
      - name: Run tests (init + structural integrity + leakage gate)
        run: npm test
